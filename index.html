  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
  // --- ตั้งค่าเปิดใช้งาน Firebase ---
  const firebaseConfig = {

  const db = firebase.database();

    const INITIAL_PRODUCTS = [
      // เครื่องดื่มแอลกอฮอล์
      { id: '1', name: 'สิงห์ขวด (ใหญ่)', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 54, selling_price: 62, current_stock: 48, min_stock_alert: 12 },
      { id: '2', name: 'สิงห์กระป๋อง (ยาว)', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 45, selling_price: 52, current_stock: 36, min_stock_alert: 10 },
      { id: '3', name: 'ลีโอขวด (ใหญ่)', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 50, selling_price: 58, current_stock: 60, min_stock_alert: 15 },
      { id: '4', name: 'ลีโอกระป๋อง (ยาว)', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 42, selling_price: 48, current_stock: 24, min_stock_alert: 10 },
      { id: '5', name: 'ช้างขวด (ใหญ่)', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 48, selling_price: 56, current_stock: 36, min_stock_alert: 12 },
      { id: '6', name: 'เหล้าขาวใหญ่ (40 ดีกรี)', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 105, selling_price: 120, current_stock: 15, min_stock_alert: 5 },
      { id: '7', name: 'เหล้าขาวเล็ก', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 55, selling_price: 65, current_stock: 20, min_stock_alert: 5 },
      { id: '8', name: 'หงส์แบน', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 135, selling_price: 150, current_stock: 10, min_stock_alert: 4 },
      { id: '9', name: 'หงส์กลม', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 260, selling_price: 290, current_stock: 8, min_stock_alert: 3 },
      { id: '10', name: 'หงส์ลิตร', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 330, selling_price: 360, current_stock: 6, min_stock_alert: 2 },
      { id: '11', name: 'แสงโสมกลม', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 290, selling_price: 320, current_stock: 7, min_stock_alert: 3 },
      { id: '12', name: 'โซดาขวด (สิงห์)', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: 8.5, selling_price: 11, current_stock: 120, min_stock_alert: 24 },

      // บุหรี่/ไฟแช็ก
      { id: '13', name: 'บุหรี่ S แดง', category: 'บุหรี่/ไฟแช็ก', cost_price: 62, selling_price: 72, current_stock: 15, min_stock_alert: 5 },
      { id: '14', name: 'บุหรี่ S เขียว', category: 'บุหรี่/ไฟแช็ก', cost_price: 62, selling_price: 72, current_stock: 12, min_stock_alert: 5 },
      { id: '15', name: 'บุหรี่ LM แดง', category: 'บุหรี่/ไฟแช็ก', cost_price: 90, selling_price: 105, current_stock: 20, min_stock_alert: 5 },
      { id: '16', name: 'ไฟแช็ก', category: 'บุหรี่/ไฟแช็ก', cost_price: 7, selling_price: 12, current_stock: 50, min_stock_alert: 10 },

      // เครื่องดื่มชูกำลัง/กาแฟ
      { id: '17', name: 'เอ็ม 150', category: 'เครื่องดื่มชูกำลัง/กาแฟ', cost_price: 10, selling_price: 12, current_stock: 48, min_stock_alert: 12 },
      { id: '18', name: 'ลีโพ', category: 'เครื่องดื่มชูกำลัง/กาแฟ', cost_price: 10, selling_price: 12, current_stock: 36, min_stock_alert: 12 },
      { id: '19', name: 'สปอนเซอร์', category: 'เครื่องดื่มชูกำลัง/กาแฟ', cost_price: 10, selling_price: 13, current_stock: 36, min_stock_alert: 10 },
      { id: '20', name: 'คาราบาวแดง', category: 'เครื่องดื่มชูกำลัง/กาแฟ', cost_price: 8.5, selling_price: 10, current_stock: 48, min_stock_alert: 12 },
      { id: '21', name: 'กะทิงแดง', category: 'เครื่องดื่มชูกำลัง/กาแฟ', cost_price: 8.5, selling_price: 10, current_stock: 24, min_stock_alert: 10 },
      { id: '22', name: 'กาแฟซอง (เบอร์ดี้)', category: 'เครื่องดื่มชูกำลัง/กาแฟ', cost_price: 4.5, selling_price: 6, current_stock: 100, min_stock_alert: 20 },
      { id: '23', name: 'โอวัลตินซอง', category: 'เครื่องดื่มชูกำลัง/กาแฟ', cost_price: 5, selling_price: 7, current_stock: 60, min_stock_alert: 15 }
    ];

    function App() {
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('grocery_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [salesHistory, setSalesHistory] = useState(() => {
        const saved = localStorage.getItem('grocery_sales_history');
        return saved ? JSON.parse(saved) : [];
      });

      const [debtors, setDebtors] = useState(() => {
        const saved = localStorage.getItem('grocery_debtors');
        return saved ? JSON.parse(saved) : [];
      });

      const [adminPassword, setAdminPassword] = useState(() => {
        return localStorage.getItem('grocery_admin_password') || '4497';
      });
 
  // ==========================================
  // 🚀 ระบบ AUTO-SAVE & REALTIME SYNC
  // ==========================================
  const [isFirebaseReady, setIsFirebaseReady] = useState(false);

  // 1. ดึงข้อมูล Realtime จาก Firebase เมื่อเปิดหน้าเว็บ
  useEffect(() => {
    db.ref('products').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        setProducts(data);
      } else {
        db.ref('products').set(INITIAL_PRODUCTS);
      }
      setIsFirebaseReady(true);
    });

    db.ref('salesHistory').on('value', (snapshot) => {
      if (snapshot.val()) setSalesHistory(snapshot.val());
    });

    db.ref('debtors').on('value', (snapshot) => {
      if (snapshot.val()) setDebtors(snapshot.val());
    });
  }, []);

  // 2. AUTO-SAVE: เซฟข้อมูลกลับ Firebase อัตโนมัติทันทีที่มีการเปลี่ยนแปลง
  useEffect(() => {
    if (isFirebaseReady && products) {
      db.ref('products').set(products);
    }
  }, [products, isFirebaseReady]);

  useEffect(() => {
    if (isFirebaseReady && salesHistory) {
      db.ref('salesHistory').set(salesHistory);
    }
  }, [salesHistory, isFirebaseReady]);

  useEffect(() => {
    if (isFirebaseReady && debtors) {
      db.ref('debtors').set(debtors);
    }
  }, [debtors, isFirebaseReady]);

      const [qrCodeImage, setQrCodeImage] = useState(() => {
        return localStorage.getItem('grocery_qr_code') || 'https://placehold.co/300x300/fbcfe8/831843?text=PromptPay+QR';
      });

      // Navigation state
      const [activeTab, setActiveTab] = useState('pos'); 
      const [searchTerm, setSearchTerm] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('ทั้งหมด');

      // Cart state
      const [cart, setCart] = useState([]);

      // Modals
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [paymentMethod, setPaymentMethod] = useState('cash'); 
      const [cashReceived, setCashReceived] = useState('');
      const [debtorName, setDebtorName] = useState('');

      const [isLowStockModalOpen, setIsLowStockModalOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      // Pack restock modal
      const [restockProduct, setRestockProduct] = useState(null);
      const [restockData, setRestockData] = useState({ packs: 1, piecesPerPack: 12, pricePerPack: '' });

      // Bulk add modal
      const [isBulkAddOpen, setIsBulkAddOpen] = useState(false);
      const [bulkItems, setBulkItems] = useState([
        { name: '', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: '', selling_price: '', current_stock: '', min_stock_alert: '5' }
      ]);

      // Edit product modal
      const [editingProduct, setEditingProduct] = useState(null);

      // Password modal
      const [passwordModal, setPasswordModal] = useState({ isOpen: false, title: '', action: null });
      const [passwordInput, setPasswordInput] = useState('');

      // Custom Alert
      const [alertDialog, setAlertDialog] = useState({ isOpen: false, title: '', message: '' });

      useEffect(() => {
        localStorage.setItem('grocery_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('grocery_sales_history', JSON.stringify(salesHistory));
      }, [salesHistory]);

      useEffect(() => {
        localStorage.setItem('grocery_debtors', JSON.stringify(debtors));
      }, [debtors]);

      useEffect(() => {
        localStorage.setItem('grocery_admin_password', adminPassword);
      }, [adminPassword]);

      useEffect(() => {
        localStorage.setItem('grocery_qr_code', qrCodeImage);
      }, [qrCodeImage]);

      const showAlert = (title, message) => {
        setAlertDialog({ isOpen: true, title, message });
      };

      const lowStockItems = useMemo(() => {
        return products.filter(p => p.current_stock <= p.min_stock_alert);
      }, [products]);

      const cartTotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.selling_price * item.qty), 0);
      }, [cart]);

      const addToCart = (product) => {
        if (product.current_stock <= 0) {
          showAlert('สินค้าหมด', `สินค้า "${product.name}" ในคลังหมดแล้ว`);
          return;
        }
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            if (existing.qty >= product.current_stock) {
              showAlert('สต็อกไม่พอ', `มีสินค้าอยู่ในคลังเพียง ${product.current_stock} ชิ้น`);
              return prev;
            }
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => {
          return prev.map(item => {
            if (item.id === id) {
              const product = products.find(p => p.id === id);
              const newQty = item.qty + delta;
              if (newQty <= 0) return null;
              if (product && newQty > product.current_stock) {
                showAlert('สต็อกไม่พอ', `มีสินค้าอยู่ในคลังเพียง ${product.current_stock} ชิ้น`);
                return item;
              }
              return { ...item, qty: newQty };
            }
            return item;
          }).filter(Boolean);
        });
      };

      const handleCheckout = () => {
        if (cart.length === 0) return;

        if (paymentMethod === 'cash') {
          const received = parseFloat(cashReceived) || 0;
          if (received < cartTotal) {
            showAlert('จำนวนเงินไม่พอ', 'เงินสดที่รับมาน้อยกว่ายอดชำระ');
            return;
          }
        }

        if (paymentMethod === 'debt' && !debtorName.trim()) {
          showAlert('กรุณากรอกชื่อ', 'กรุณาระบุชื่อผู้ติดหนี้');
          return;
        }

        const updatedProducts = products.map(p => {
          const cartItem = cart.find(c => c.id === p.id);
          if (cartItem) {
            return { ...p, current_stock: Math.max(0, p.current_stock - cartItem.qty) };
          }
          return p;
        });

        setProducts(updatedProducts);

        const totalCost = cart.reduce((sum, item) => sum + (item.cost_price * item.qty), 0);
        const profit = cartTotal - totalCost;

        const newSale = {
          id: 'BILL-' + Date.now(),
          date: new Date().toISOString(),
          items: cart,
          total_amount: cartTotal,
          total_cost: totalCost,
          profit: profit,
          payment_method: paymentMethod,
          cash_received: paymentMethod === 'cash' ? parseFloat(cashReceived) : cartTotal,
          change: paymentMethod === 'cash' ? (parseFloat(cashReceived) - cartTotal) : 0,
          debtor_name: paymentMethod === 'debt' ? debtorName.trim() : null
        };

        setSalesHistory([newSale, ...salesHistory]);

        if (paymentMethod === 'debt') {
          const debtor = debtors.find(d => d.name.toLowerCase() === debtorName.trim().toLowerCase());
          if (debtor) {
            setDebtors(debtors.map(d => d.id === debtor.id ? { ...d, total_debt: d.total_debt + cartTotal, status: 'unpaid' } : d));
          } else {
            setDebtors([...debtors, {
              id: 'DEBT-' + Date.now(),
              name: debtorName.trim(),
              total_debt: cartTotal,
              status: 'unpaid',
              createdAt: new Date().toISOString()
            }]);
          }
        }

        setCart([]);
        setIsCheckoutOpen(false);
        setCashReceived('');
        setDebtorName('');
        showAlert('บันทึกการขายสำเร็จ', 'ทำรายการขายและตัดสต็อกเรียบร้อยแล้ว');
      };

      const requestPassword = (title, action) => {
        setPasswordModal({ isOpen: true, title, action });
        setPasswordInput('');
      };

      const verifyPassword = () => {
        if (passwordInput === adminPassword) {
          if (passwordModal.action) passwordModal.action();
          setPasswordModal({ isOpen: false, title: '', action: null });
          setPasswordInput('');
        } else {
          showAlert('รหัสผ่านไม่ถูกต้อง', 'กรุณาลองใหม่อีกครั้ง (รหัสเริ่มต้นคือ 4497)');
        }
      };

      const handleDeleteProduct = (productId) => {
        requestPassword('ยืนยันการลบสินค้า', () => {
          setProducts(products.filter(p => p.id !== productId));
          showAlert('สำเร็จ', 'ลบสินค้าเรียบร้อยแล้ว');
        });
      };

      const handleRestockPack = () => {
        if (!restockProduct) return;
        const packs = parseInt(restockData.packs) || 0;
        const piecesPerPack = parseInt(restockData.piecesPerPack) || 1;
        const pricePerPack = parseFloat(restockData.pricePerPack) || 0;

        if (packs <= 0 || pricePerPack <= 0) {
          showAlert('ข้อมูลไม่ถูกต้อง', 'กรุณากรอกจำนวนแพ็คและราคาให้ถูกต้อง');
          return;
        }

        const totalNewPieces = packs * piecesPerPack;
        const newCostPerPiece = pricePerPack / piecesPerPack;

        setProducts(products.map(p => {
          if (p.id === restockProduct.id) {
            return {
              ...p,
              current_stock: p.current_stock + totalNewPieces,
              cost_price: Math.round(newCostPerPiece * 100) / 100
            };
          }
          return p;
        }));

        setRestockProduct(null);
        setRestockData({ packs: 1, piecesPerPack: 12, pricePerPack: '' });
        showAlert('บันทึกสำเร็จ', `เพิ่มสต็อก ${restockProduct.name} จำนวน ${totalNewPieces} ชิ้นเรียบร้อยแล้ว`);
      };

      const handleSaveBulkProducts = () => {
        const validItems = bulkItems.filter(item => item.name.trim() !== '');
        if (validItems.length === 0) {
          showAlert('ข้อมูลว่างเปล่า', 'กรุณากรอกชื่อสินค้าอย่างน้อย 1 รายการ');
          return;
        }

        const newProducts = validItems.map((item, idx) => ({
          id: 'PROD-' + (Date.now() + idx),
          name: item.name.trim(),
          category: item.category,
          cost_price: parseFloat(item.cost_price) || 0,
          selling_price: parseFloat(item.selling_price) || 0,
          current_stock: parseInt(item.current_stock) || 0,
          min_stock_alert: parseInt(item.min_stock_alert) || 5
        }));

        setProducts([...products, ...newProducts]);
        setIsBulkAddOpen(false);
        setBulkItems([{ name: '', category: 'เครื่องดื่มแอลกอฮอล์', cost_price: '', selling_price: '', current_stock: '', min_stock_alert: '5' }]);
        showAlert('สำเร็จ', `เพิ่มสินค้าใหม่ ${newProducts.length} รายการเรียบร้อยแล้ว`);
      };

      const handleDeleteBill = (billId) => {
        requestPassword('ยืนยันการลบบิลขาย', () => {
          const bill = salesHistory.find(b => b.id === billId);
          if (bill) {
            const restoredProducts = products.map(p => {
              const item = bill.items.find(i => i.id === p.id);
              if (item) {
                return { ...p, current_stock: p.current_stock + item.qty };
              }
              return p;
            });
            setProducts(restoredProducts);
            setSalesHistory(salesHistory.filter(b => b.id !== billId));
            showAlert('สำเร็จ', 'ลบบิลและคืนสต็อกสินค้าเข้าคลังเรียบร้อยแล้ว');
          }
        });
      };

      const handleMarkDebtPaid = (debtorId) => {
        setDebtors(debtors.map(d => {
          if (d.id === debtorId) {
            return { ...d, status: 'paid', paidAt: new Date().toISOString() };
          }
          return d;
        }));
        showAlert('ชำระหนี้แล้ว', 'อัปเดตสถานะเป็น "ชำระเงินหรือหนี้แล้ว" เรียบร้อยแล้ว');
      };

      const handleDeleteDebtor = (debtorId) => {
        requestPassword('ยืนยันการลบรายชื่อติดหนี้', () => {
          setDebtors(debtors.filter(d => d.id !== debtorId));
          showAlert('สำเร็จ', 'ลบรายการติดหนี้เรียบร้อยแล้ว');
        });
      };

      const handleExportData = () => {
        try {
          const fullData = {
            products,
            salesHistory,
            debtors,
            adminPassword,
            qrCodeImage,
            backupDate: new Date().toISOString()
          };
          const jsonStr = JSON.stringify(fullData, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          
          const link = document.createElement('a');
          link.href = url;
          link.download = `Grocery_Backup_${new Date().toISOString().split('T')[0]}.json`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          
          showAlert('สำรองข้อมูลสำเร็จ', 'ดาวน์โหลดไฟล์ข้อมูลสำรองเรียบร้อยแล้ว');
        } catch (err) {
          showAlert('ผิดพลาด', 'ไม่สามารถส่งออกข้อมูลได้');
        }
      };

      const fileInputRef = useRef(null);
      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported.products) setProducts(imported.products);
            if (imported.salesHistory) setSalesHistory(imported.salesHistory);
            if (imported.debtors) setDebtors(imported.debtors);
            if (imported.adminPassword) setAdminPassword(imported.adminPassword);
            if (imported.qrCodeImage) setQrCodeImage(imported.qrCodeImage);

            showAlert('กู้คืนข้อมูลสำเร็จ', 'นำเข้าข้อมูลทั้งหมดเข้าสู่ระบบเรียบร้อยแล้ว');
            setIsSettingsOpen(false);
          } catch (err) {
            showAlert('ไฟล์ไม่ถูกต้อง', 'ไม่สามารถอ่านไฟล์ JSON ได้');
          }
        };
        reader.readAsText(file);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

          {passwordModal.isOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-xs w-full p-6 shadow-xl border-2 border-pink-200 space-y-4 text-center">
                <div className="bg-pink-100 p-3 rounded-full w-12 h-12 mx-auto flex items-center justify-center text-pink-600">
                  <i className="fa-solid fa-shield-halved text-xl"></i>
                </div>

                <div>
                  <h3 className="font-black text-base text-gray-800">{passwordModal.title}</h3>
                  <p className="text-xs text-gray-500 mt-1">กรุณากรอกรหัสผ่านเพื่อยืนยัน (4497)</p>
                </div>

                <input
                  type="password"
                  value={passwordInput}
                  onChange={(e) => setPasswordInput(e.target.value)}
                  placeholder="รหัสผ่าน..."
                  className="w-full p-3 border-2 border-pink-200 rounded-xl text-center font-black text-lg focus:outline-none focus:border-pink-500"
                  autoFocus
                />

                <div className="flex gap-2">
                  <button
                    onClick={() => setPasswordModal({ isOpen: false, title: '', action: null })}
                    className="flex-1 py-2 bg-gray-100 text-gray-700 font-bold text-xs rounded-xl"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={verifyPassword}
                    className="flex-1 py-2 bg-pink-500 text-white font-bold text-xs rounded-xl shadow hover:bg-pink-600"
                  >
                    ยืนยัน
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Custom Alert Dialog */}
          {alertDialog.isOpen && (
            <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-xs w-full p-5 shadow-xl border-2 border-pink-200 space-y-3 text-center">
                <h3 className="font-black text-base text-gray-800">{alertDialog.title}</h3>
                <p className="text-xs text-gray-600">{alertDialog.message}</p>
                <button
                  onClick={() => setAlertDialog({ isOpen: false, title: '', message: '' })}
                  className="w-full py-2 bg-pink-500 text-white font-bold text-xs rounded-xl shadow hover:bg-pink-600"
                >
                  ตกลง
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
